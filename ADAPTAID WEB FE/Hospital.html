<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <a href="Home.html">&larr; Home</a>
  <div class="title">Hospital Login</div>

  <div class="form-container">
    <div class="form-left">
      <div class="toggle">
        <label><input type="radio" name="mode" checked> LOGIN</label>
        <label><input type="radio" name="mode"> SIGN UP</label>
      </div>

      <div class="input-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Name">
      </div>

      <div class="input-group">
        <label for="email">Email*</label>
        <input type="email" id="email" placeholder="Email">
      </div>

      <div class="input-group">
        <label for="phone">Phone no.*</label>
        <input type="tel" id="phone" placeholder="Phone no.">
      </div>

      <button class="btn">Send OTP</button>
    </div>

    <div class="form-right">
      <div class="star"></div>
      <div class="star green"></div>
    </div>
  </div>

</body>
</html>
