<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptaid | FAQ</title>
  <link rel="stylesheet" href="Home.css">
  <style>
    .faq-container {
      padding: 40px;
    }
    .faq-item {
      background: #fff;
      border-radius: 10px;
      margin-bottom: 15px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: all 0.3s;
    }
    .faq-item h3 {
      margin: 0;
      color: #191923;
      font-size: 18px;
    }
    .faq-item p {
      display: none;
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }
    .faq-item.active p {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <a href="Home.html">ADAPTAID</a>
    <p>Empowering Lives with Adaptive Prosthetics</p>
  </header>

  <section class="faq-container">
    <h2 style="background:#ccffcc;display:inline-block;padding:8px 15px;border-radius:6px;">Frequently Asked Questions</h2>
    <div id="faq-list"></div>
  </section>

  <script src="faq.js"></script>
</body>
</html>
