<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptaid | Partners</title>
  <link rel="stylesheet" href="Home.css">
  <style>
    .partners-container {
      padding: 40px;
    }
    .filter {
      margin-bottom: 20px;
    }
    .filter select {
      padding: 8px 12px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .partner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .partner-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 20px;
      transition: transform 0.3s;
    }
    .partner-card:hover {
      transform: translateY(-5px);
    }
    .partner-card h3 {
      margin: 0 0 10px 0;
      color: #191923;
    }
    .partner-card p {
      margin: 5px 0;
      font-size: 14px;
      color: #333;
    }
    .partner-card a {
      text-decoration: none;
      color: #0066cc;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <a href="Home.html">ADAPTAID</a>
    <p>Empowering Lives with Adaptive Prosthetics</p>
  </header>

  <section class="partners-container">
    <h2 style="background:#ccffcc;display:inline-block;padding:8px 15px;border-radius:6px;">Our Partners</h2>
    <div class="filter">
      <label for="typeFilter">Filter by Type: </label>
      <select id="typeFilter">
        <option value="all">All</option>
        <option value="NGO">NGO</option>
        <option value="Hospital">Hospital</option>
        <option value="Manufacturer">Manufacturer</option>
      </select>
    </div>
    <div class="partner-grid" id="partnerGrid"></div>
  </section>

  <script src="partners.js"></script>
</body>
</html>
